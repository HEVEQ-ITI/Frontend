<div class="auth-wrapper">
    <div class="auth-card card">
        <div class="auth-header">
            <div class="auth-logo">
                شير<span>جير</span>
            </div>

            <h1>تأكيد البريد الإلكتروني</h1>
            <p>قم بتأكيد بريدك الإلكتروني لتفعيل حسابك</p>
        </div>

        <div *ngIf="isLoading" class="success-message">
            جاري تنفيذ الطلب...
        </div>

        <p class="success-message" *ngIf="successMessage">
            {{ successMessage }}
        </p>

        <p class="error-message" *ngIf="errorMessage">
            {{ errorMessage }}
        </p>

        <div class="form-group" *ngIf="!isConfirmed">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-input" name="email" [(ngModel)]="email" placeholder="example@mail.com">
        </div>

        <button type="button" class="btn btn-primary w-full" [disabled]="isLoading || isConfirmed"
            (click)="resendConfirmationEmail()">
            إعادة إرسال رابط التأكيد
        </button>

        <div class="auth-footer">
            تم التأكيد؟
            <a routerLink="/login">تسجيل الدخول</a>
        </div>
    </div>
</div>
