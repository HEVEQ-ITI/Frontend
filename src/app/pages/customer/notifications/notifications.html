<section class="notifications-page">
    <div class="page-header">
        <div>
            <h1>الإشعارات</h1>
            <p>تابع آخر التحديثات الخاصة بالحجوزات والمستندات والدعم الفني</p>
        </div>

        <div class="notification-summary">
            <span>غير مقروءة</span>
            <strong>{{ unreadCount }}</strong>
        </div>
    </div>

    <div class="card notifications-card">
        <div *ngIf="isLoading" class="state-message">
            جاري تحميل الإشعارات...
        </div>

        <div *ngIf="!isLoading && errorMessage" class="error-message">
            {{ errorMessage }}
        </div>

        <div *ngIf="!isLoading && !errorMessage && notifications.length === 0" class="empty-state">
            <div class="empty-icon">🔔</div>
            <h3>لا توجد إشعارات حتى الآن</h3>
            <p>أي تحديثات جديدة هتظهر هنا تلقائيًا</p>
        </div>

        <div class="notifications-list" *ngIf="!isLoading && notifications.length > 0">
            <button type="button" class="notification-item"
                *ngFor="let notification of notifications; trackBy: trackById" [class.unread]="!notification.isRead"
                (click)="markAsRead(notification)">

                <div class="notification-icon">
                    {{ getNotificationIcon(notification.eventType) }}
                </div>

                <div class="notification-content">
                    <div class="notification-title-row">
                        <h3>{{ notification.title }}</h3>
                        <span class="notification-time">
                            {{ notification.sentAt | date:'short' }}
                        </span>
                    </div>

                    <p>{{ notification.body }}</p>

                    <div class="notification-meta">
                        <span>{{ notification.eventType }}</span>
                        <span *ngIf="notification.referenceType">
                            {{ notification.referenceType }}
                        </span>
                    </div>
                </div>

                <span class="unread-dot" *ngIf="!notification.isRead"></span>
            </button>
        </div>
    </div>
</section>
